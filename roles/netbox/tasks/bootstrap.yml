---
- name: Wait for NetBox API
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/api/status/
    status_code: 200
  register: netbox_status
  retries: 60
  delay: 10
  until: netbox_status.status == 200

- name: Verify superuser API token works
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/api/users/tokens/
    headers:
      Authorization: "Token {{ netbox_api_token }}"
    status_code: 200
  no_log: true
