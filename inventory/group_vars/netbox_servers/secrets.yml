---
# Tier-1 secrets — path /netbox. Source picked by secrets_backend
# (inventory/group_vars/all/secrets.yml): vault (Phase A, default) or
# infisical (Phase B, after playbooks/90-migrate-secrets.yml). Jinja only
# evaluates the taken branch, so vault mode never contacts Infisical and
# infisical mode never needs inventory/group_vars/netbox_servers/vault.yml.
keepalived_netbox_password: >-
  {{ vault_keepalived_netbox_password if secrets_backend == 'vault' else
     (lookup('infisical.vault.read_secrets',
      universal_auth_client_id=infisical_client_id,
      universal_auth_client_secret=infisical_client_secret,
      url=infisical_url, project_id=infisical_project_id,
      env_slug=infisical_env_slug, path='/netbox',
      secret_name='KEEPALIVED_NETBOX_PASSWORD')).value }}

netbox_secret_key: >-
  {{ vault_netbox_secret_key if secrets_backend == 'vault' else
     (lookup('infisical.vault.read_secrets',
      universal_auth_client_id=infisical_client_id,
      universal_auth_client_secret=infisical_client_secret,
      url=infisical_url, project_id=infisical_project_id,
      env_slug=infisical_env_slug, path='/netbox',
      secret_name='NETBOX_SECRET_KEY')).value }}

